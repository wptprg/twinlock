<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">
<meta name="description" content="Twinlock: your crypto wallet recovery phrase, encrypted. One HTML file, two keys, no internet. Free and open source.">
<title>Twinlock — your recovery phrase, encrypted</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E">
</head>
<body data-pagina="index">

<nav class="topo">
  <div class="wrap">
    <a class="logo" href="#">🔐 Twinlock</a>
    <div class="links">
      <a href="#como" data-i18n="navComo"></a>
      <a href="#seguranca" data-i18n="navSeguranca"></a>
      <a href="#baixar" data-i18n="navBaixar"></a>
      <a href="#faq" data-i18n="navFaq"></a>
      <a href="tutorial.html" data-i18n="navTutorial"></a>
      <a data-repo="" href="https://github.com/wptprg/twinlock" data-i18n="navCodigo"></a>
    </div>
    <select class="idioma" aria-label="Language">
      <option value="en">English</option>
      <option value="pt-BR">Português</option>
      <option value="es">Español</option>
    </select>
  </div>
</nav>

<header class="hero">
  <div class="wrap grade">
    <div>
      <h1><span data-i18n="h1a"></span><br><span data-i18n="h1b"></span></h1>
      <p class="sub" data-i18n="sub"></p>
      <div class="acoes">
        <a class="btn primario grande" data-download href="#baixar" data-i18n="btnBaixar"></a>
        <a class="btn grande" href="tutorial.html" data-i18n="btnTutorial"></a>
      </div>
      <div class="hash"><span data-i18n="hashRotulo"></span><br><code data-hash></code></div>
    </div>
    <div class="moldura">
      <div class="barra"><i></i><i></i><i></i></div>
      <img data-shot="cards" alt="Twinlock: wallet cards" width="1280" height="820">
    </div>
  </div>
</header>

<section id="problema">
  <div class="wrap">
    <h2 data-i18n="probTitulo"></h2>
    <p class="lead" data-i18n="probLead"></p>
    <div class="cartoes">
      <div class="cartao"><div class="ico">🔥</div><h3 data-i18n="prob1T"></h3><p data-i18n="prob1P"></p></div>
      <div class="cartao"><div class="ico">📍</div><h3 data-i18n="prob2T"></h3><p data-i18n="prob2P"></p></div>
      <div class="cartao"><div class="ico">📸</div><h3 data-i18n="prob3T"></h3><p data-i18n="prob3P"></p></div>
    </div>
  </div>
</section>

<section id="como" class="alt">
  <div class="wrap">
    <h2 data-i18n="comoTitulo"></h2>
    <p class="lead" data-i18n="comoLead"></p>

    <div class="passo">
      <div class="texto"><span class="num">1</span><h3 data-i18n="p1T"></h3><p data-i18n="p1P"></p></div>
      <div class="moldura"><div class="barra"><i></i><i></i><i></i></div><img data-shot="home" alt="Choosing the folder" width="1280" height="820"></div>
    </div>
    <div class="passo">
      <div class="texto"><span class="num">2</span><h3 data-i18n="p2T"></h3><p data-i18n="p2P"></p></div>
      <div class="moldura"><div class="barra"><i></i><i></i><i></i></div><img data-shot="new1" alt="Name and two keys" width="1280" height="820"></div>
    </div>
    <div class="passo">
      <div class="texto"><span class="num">3</span><h3 data-i18n="p3T"></h3><p data-i18n="p3P"></p></div>
      <div class="moldura"><div class="barra"><i></i><i></i><i></i></div><img data-shot="new2" alt="Typing the words" width="1280" height="820"></div>
    </div>
    <div class="passo">
      <div class="texto"><span class="num">4</span><h3 data-i18n="p4T"></h3><p data-i18n="p4P"></p></div>
      <div class="moldura"><div class="barra"><i></i><i></i><i></i></div><img data-shot="open" alt="Reading the words one at a time" width="1280" height="820"></div>
    </div>
  </div>
</section>

<section id="seguranca">
  <div class="wrap">
    <h2 data-i18n="segTitulo"></h2>
    <p class="lead" data-i18n="segLead"></p>
    <div class="duas">
      <div class="lista ok"><h3 data-i18n="protT"></h3><ul><li data-i18n="prot1"></li><li data-i18n="prot2"></li><li data-i18n="prot3"></li><li data-i18n="prot4"></li></ul></div>
      <div class="lista nao"><h3 data-i18n="naoT"></h3><ul><li data-i18n="nao1"></li><li data-i18n="nao2"></li><li data-i18n="nao3"></li><li data-i18n="nao4"></li></ul></div>
    </div>
    <div class="fatos">
      <div class="fato"><b data-i18n="f1b"></b><span data-i18n="f1s"></span></div>
      <div class="fato"><b data-i18n="f2b"></b><span data-i18n="f2s"></span></div>
      <div class="fato"><b data-i18n="f3b"></b><span data-i18n="f3s"></span></div>
      <div class="fato"><b data-i18n="f4b"></b><span data-i18n="f4s"></span></div>
      <div class="fato"><b data-i18n="f5b"></b><span data-i18n="f5s"></span></div>
      <div class="fato"><b data-i18n="f6b"></b><span data-i18n="f6s"></span></div>
    </div>
  </div>
</section>

<section id="baixar" class="alt">
  <div class="wrap">
    <h2 data-i18n="verTitulo"></h2>
    <p class="lead" data-i18n="verLead"></p>
    <div class="acoes" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;">
      <a class="btn primario grande" data-download href="https://github.com/wptprg/twinlock/releases/latest" data-i18n="btnBaixar"></a>
      <a class="btn grande" data-repo="/releases" href="https://github.com/wptprg/twinlock/releases">Releases</a>
    </div>
    <div class="hash" style="margin:0 0 22px;"><span data-i18n="hashRotulo"></span><br><code data-hash></code></div>
    <div class="os">
      <div><b data-i18n="verWin"></b><pre>Get-FileHash twinlock.html -Algorithm SHA256</pre></div>
      <div><b data-i18n="verMac"></b><pre>shasum -a 256 twinlock.html</pre></div>
      <div><b data-i18n="verLin"></b><pre>sha256sum twinlock.html</pre></div>
    </div>
    <div class="perigo-box" data-i18n="verAviso"></div>
  </div>
</section>

<section id="recuperar">
  <div class="wrap">
    <h2 data-i18n="recTitulo"></h2>
    <p class="lead" data-i18n="recLead"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <a class="btn" data-repo="/blob/main/SPEC.md" href="https://github.com/wptprg/twinlock/blob/main/SPEC.md" data-i18n="recBtn"></a>
      <a class="btn" data-repo="/tree/main/tools" href="https://github.com/wptprg/twinlock/tree/main/tools" data-i18n="recBtn2"></a>
    </div>
  </div>
</section>

<section id="faq" class="alt">
  <div class="wrap">
    <h2 data-i18n="faqTitulo"></h2>
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
    <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
    <details><summary data-i18n="q6"></summary><p data-i18n="a6"></p></details>
  </div>
</section>

<section id="apoiar">
  <div class="wrap">
    <h2 data-i18n="apoioTitulo"></h2>
    <p class="lead" data-i18n="apoioLead"></p>
    <div class="doacoes">
      <div class="doacao">
        <h3>Bitcoin (BTC)</h3>
        <img src="img/btc.svg" alt="QR code: Bitcoin address" width="160" height="160">
        <code data-endereco="btc"></code>
        <button type="button" class="btn copiar" data-copiar="btc" data-i18n="apoioCopiar"></button>
      </div>
      <div class="doacao">
        <h3>Ethereum (ETH)</h3>
        <img src="img/eth.svg" alt="QR code: Ethereum address" width="160" height="160">
        <code data-endereco="eth"></code>
        <button type="button" class="btn copiar" data-copiar="eth" data-i18n="apoioCopiar"></button>
      </div>
    </div>
    <div class="aviso" data-i18n="apoioAviso"></div>
  </div>
</section>
