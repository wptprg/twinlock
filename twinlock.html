<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Twinlock — your recovery phrase, encrypted. One file, two keys, no internet.
  Single-file, dependency-free, offline. The Content-Security-Policy below blocks ALL network access:
  nothing you type can leave this page. See SPEC.md for the file format and tools/ for a standalone recovery script.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Twinlock</title>
<style>
  :root {
    --fundo: #f3f4f6;
    --superficie: #ffffff;
    --borda: #d6d9df;
    --texto: #1b1f27;
    --texto-2: #5b6372;
    --primaria: #1f5fbf;
    --primaria-texto: #ffffff;
    --perigo: #b42318;
    --perigo-fundo: #fef3f2;
    --ok: #157347;
    --ok-fundo: #ecfdf3;
    --aviso: #9a6700;
    --aviso-fundo: #fff8e1;
    --sombra: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.06);
    --raio: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1218;
      --superficie: #181c25;
      --borda: #2b313d;
      --texto: #e7eaf0;
      --texto-2: #9aa3b2;
      --primaria: #5b96f0;
      --primaria-texto: #0b1220;
      --perigo: #f28b82;
      --perigo-fundo: #2a1716;
      --ok: #6fcf97;
      --ok-fundo: #142a1e;
      --aviso: #f2c14e;
      --aviso-fundo: #2b2410;
      --sombra: 0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .95em; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--borda); background: var(--superficie); }
  header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 small { font-weight: 400; color: var(--texto-2); font-size: 13px; }
  .acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--borda); font-size: 13px; color: var(--texto-2); max-width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chip.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-fundo); }
  select.idioma { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--borda); background: var(--superficie); font-size: 13px; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--borda); background: var(--superficie); cursor: pointer; transition: filter .15s, transform .05s; }
  .btn:hover { filter: brightness(.96); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primario { background: var(--primaria); border-color: var(--primaria); color: var(--primaria-texto); font-weight: 600; }
  .btn.perigo { color: var(--perigo); border-color: var(--perigo); background: var(--perigo-fundo); }
  .btn.pequeno { padding: 6px 10px; font-size: 14px; }
  .btn.link { border: none; background: none; color: var(--primaria); padding: 4px 6px; text-decoration: underline; }

  .painel { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 20px; box-shadow: var(--sombra); }
  .painel h2 { margin: 0 0 8px; font-size: 18px; }
  .painel p { margin: 6px 0; color: var(--texto-2); }
  .aviso { border-left: 4px solid var(--aviso); background: var(--aviso-fundo); padding: 12px 14px; border-radius: 8px; margin: 12px 0; font-size: 14px; }
  .aviso ul { margin: 6px 0 0 18px; padding: 0; }
  .erro-box { border-left: 4px solid var(--perigo); background: var(--perigo-fundo); color: var(--perigo); padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }

  .grade-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 20px; }
  .card { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px; min-height: 130px; cursor: pointer; box-shadow: var(--sombra); display: flex; flex-direction: column; justify-content: space-between; transition: transform .12s, border-color .12s; text-align: left; }
  .card:hover { transform: translateY(-2px); border-color: var(--primaria); }
  .card:focus-visible { outline: 3px solid var(--primaria); outline-offset: 2px; }
  .card .titulo { font-size: 18px; font-weight: 600; display: flex; gap: 8px; align-items: center; word-break: break-word; }
  .card .titulo.cifrada { color: var(--texto-2); font-style: italic; font-weight: 500; }
  .card .meta { color: var(--texto-2); font-size: 13px; margin-top: 10px; }
  .card.nova { border-style: dashed; align-items: center; justify-content: center; color: var(--primaria); font-weight: 600; font-size: 17px; }
  .card.nova .mais { font-size: 34px; line-height: 1; }

  dialog { border: none; border-radius: 16px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--superficie); color: var(--texto); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
  .dlg-cabecalho { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--borda); }
  .dlg-cabecalho h2 { margin: 0; font-size: 19px; }
  .dlg-corpo { padding: 20px 22px; overflow: auto; max-height: calc(100vh - 190px); }
  .dlg-rodape { display: flex; justify-content: space-between; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--borda); flex-wrap: wrap; }
  .dlg-rodape .direita { display: flex; gap: 10px; margin-left: auto; }

  .passos { display: flex; gap: 6px; margin-bottom: 18px; font-size: 13px; color: var(--texto-2); flex-wrap: wrap; }
  .passos span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--borda); }
  .passos span.ativo { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); font-weight: 600; }
  .passos span.feito { border-color: var(--ok); color: var(--ok); }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
  .campo .dica { font-size: 13px; color: var(--texto-2); margin-top: 4px; }
  .campo.caixa label { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; cursor: pointer; }
  .campo.caixa input { margin-top: 3px; }
  .entrada { display: flex; align-items: stretch; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); overflow: hidden; }
  .entrada:focus-within { border-color: var(--primaria); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primaria) 20%, transparent); }
  .entrada input { flex: 1; border: none; background: transparent; padding: 11px 12px; min-width: 0; outline: none; font-size: 16px; }
  .entrada .olho { border: none; background: transparent; padding: 0 12px; cursor: pointer; color: var(--texto-2); }
  .entrada .olho:hover { color: var(--texto); }
  .contador { font-size: 12px; color: var(--texto-2); text-align: right; }
  .regras { list-style: none; padding: 0; margin: 6px 0 0; font-size: 13px; display: grid; gap: 2px; }
  .regras li::before { content: "○ "; color: var(--texto-2); }
  .regras li.ok { color: var(--ok); }
  .regras li.ok::before { content: "✔ "; }
  .forca { height: 6px; border-radius: 3px; background: var(--borda); margin-top: 8px; overflow: hidden; }
  .forca i { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
  .forca-rotulo { font-size: 12px; color: var(--texto-2); margin-top: 4px; }
  .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .duas-colunas { grid-template-columns: 1fr; } }
  .combinado { font-size: 13px; color: var(--texto-2); margin: -4px 0 14px; }
  .combinado.ok { color: var(--ok); }

  .seletor-qtd { display: inline-flex; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
  .seletor-qtd label { padding: 8px 16px; cursor: pointer; border-right: 1px solid var(--borda); }
  .seletor-qtd label:last-child { border-right: none; }
  .seletor-qtd input { display: none; }
  .seletor-qtd input:checked + span { font-weight: 700; color: var(--primaria); }
  .seletor-qtd label:has(input:checked) { background: color-mix(in srgb, var(--primaria) 12%, transparent); }

  .grade-palavras { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .palavra { display: flex; align-items: center; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); overflow: hidden; }
  .palavra b { width: 34px; text-align: center; font-size: 12px; color: var(--texto-2); border-right: 1px solid var(--borda); align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .palavra input { flex: 1; min-width: 0; border: none; background: transparent; padding: 9px 10px; outline: none; font-family: ui-monospace, Consolas, monospace; font-size: 15px; }
  .palavra.ok { border-color: var(--ok); }
  .palavra.erro { border-color: var(--perigo); background: var(--perigo-fundo); }
  .palavra:focus-within { border-color: var(--primaria); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primaria) 20%, transparent); }
  .palavra .texto { flex: 1; padding: 9px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 15px; user-select: text; }
  .grade-palavras.oculta .texto { filter: blur(7px); user-select: none; transition: filter .12s; }
  .grade-palavras.oculta .palavra { cursor: pointer; touch-action: manipulation; -webkit-touch-callout: none; }
  .grade-palavras.oculta .palavra:hover .texto,
  .grade-palavras.oculta .palavra:focus-visible .texto,
  .grade-palavras.oculta .palavra.revelada .texto { filter: none; user-select: text; }
  .grade-palavras.oculta .palavra:focus-visible { outline: 2px solid var(--primaria); outline-offset: 1px; }
  .status-palavras { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 14px; color: var(--texto-2); flex-wrap: wrap; gap: 8px; }

  .resumo dt { font-weight: 600; font-size: 13px; color: var(--texto-2); margin-top: 10px; }
  .resumo dd { margin: 2px 0 0; font-size: 16px; }

  .barra-trava { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--texto-2); }
  .barra-trava b { font-variant-numeric: tabular-nums; color: var(--texto); }

  /* ---- access book ---- */
  .status-palavras .entrada { flex: 1 1 200px; }
  .status-palavras .entrada input { padding: 8px 12px; font-size: 15px; }
  .lista-acessos { display: grid; gap: 8px; margin-top: 12px; }
  .acesso { border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); }
  .acesso .linha { display: flex; gap: 6px 10px; align-items: center; padding: 10px 12px; cursor: pointer; flex-wrap: wrap; border-radius: 10px; }
  .acesso .linha:hover { background: color-mix(in srgb, var(--primaria) 6%, transparent); }
  .acesso .linha:focus-visible { outline: 2px solid var(--primaria); outline-offset: -2px; }
  .acesso .nome { font-weight: 600; word-break: break-word; }
  .acesso .end { color: var(--texto-2); font-size: 13px; word-break: break-all; }
  .acesso .usu { flex: 1 1 100%; color: var(--texto-2); font-size: 14px; word-break: break-all; }
  .acesso .badges { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--borda); background: var(--superficie); white-space: nowrap; }
  .badge.codigo { border-color: var(--primaria); color: var(--primaria); font-weight: 600; }
  .acesso .detalhes { display: none; padding: 4px 12px 12px; border-top: 1px solid var(--borda); }
  .acesso.aberto .detalhes { display: block; }
  .detalhes .item { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
  .detalhes .item b { color: var(--texto-2); font-weight: 600; font-size: 13px; min-width: 110px; }
  .detalhes .item .valor { white-space: pre-wrap; word-break: break-word; }
  .detalhes .datas { font-size: 12px; color: var(--texto-2); margin-top: 10px; }
  .detalhes .acoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .segredo { font-family: ui-monospace, Consolas, monospace; filter: blur(6px); user-select: none; cursor: pointer; transition: filter .12s; padding: 0 4px; border-radius: 4px; touch-action: manipulation; -webkit-touch-callout: none; }
  .segredo:hover, .segredo:focus-visible, .segredo.revelada { filter: none; user-select: text; }
  .segredo:focus-visible { outline: 2px solid var(--primaria); }
  textarea.area { width: 100%; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); padding: 10px 12px; min-height: 76px; resize: vertical; outline: none; font: inherit; color: inherit; }
  textarea.area:focus { border-color: var(--primaria); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primaria) 20%, transparent); }
  .campo-extra { display: grid; grid-template-columns: 1fr 1.4fr auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .campo-extra .entrada input { padding: 8px 10px; font-size: 15px; }
  .campo-extra label { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--texto-2); cursor: pointer; white-space: nowrap; }
  @media (max-width: 640px) { .campo-extra { grid-template-columns: 1fr 1fr; } }
  .intro-caderno { border-left: 4px solid var(--primaria); background: color-mix(in srgb, var(--primaria) 8%, transparent); padding: 12px 14px; border-radius: 8px; margin: 0 0 16px; font-size: 14px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--texto); color: var(--fundo); padding: 12px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); font-size: 14px; z-index: 50; }
  #toast.visivel { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.erro { background: var(--perigo); color: #fff; }

  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: gira .7s linear infinite; display: inline-block; }
  @keyframes gira { to { transform: rotate(360deg); } }
  footer { text-align: center; color: var(--texto-2); font-size: 12px; margin-top: 40px; line-height: 1.7; }
</style>
</head>
<body>

<header>
  <h1>🔐 Twinlock <small data-i18n="slogan"></small></h1>
  <div class="acoes-topo">
    <select id="selIdioma" class="idioma" aria-label="Language">
      <option value="en">English</option>
      <option value="pt-BR">Português</option>
      <option value="es">Español</option>
    </select>
    <span id="chipPasta" class="chip"></span>
    <button id="btnAbrirPasta" class="btn pequeno"></button>
    <button id="btnRecarregar" class="btn pequeno" hidden>↻</button>
  </div>
</header>

<main>
  <section id="painelIncompativel" class="painel" hidden>
    <h2 data-i18n="incompativelTitulo"></h2>
    <p data-i18n="incompativelTexto"></p>
  </section>

  <section id="painelInicio" class="painel">
    <h2 data-i18n="inicioTitulo"></h2>
    <p data-i18n="inicioTexto"></p>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <button id="btnEscolherPasta" class="btn primario" data-i18n="escolherPasta"></button>
      <button id="btnReabrirPasta" class="btn" hidden></button>
      <button id="btnModoManual" class="btn link" data-i18n="linkManual"></button>
    </div>
    <div id="painelManual" hidden style="margin-top:14px;">
      <p data-i18n="manualTexto"></p>
      <input id="inputArquivos" type="file" accept=".json,application/json" multiple>
    </div>
    <div class="aviso">
      <strong data-i18n="leiaAntes"></strong>
      <ul>
        <li data-i18n="aviso1"></li>
        <li data-i18n="aviso2"></li>
        <li data-i18n="aviso3"></li>
        <li data-i18n="aviso4"></li>
        <li data-i18n="aviso5"></li>
      </ul>
    </div>
  </section>

  <section id="secaoCarteiras" hidden>
    <div class="grade-cards" id="gradeCards"></div>
  </section>

  <footer id="rodape">
    <span id="rodapeVersao"></span><br>
    <span id="autoteste"></span>
  </footer>
</main>

<!-- ============ NEW WALLET ============ -->
<dialog id="dlgNova">
  <div class="dlg-cabecalho">
    <h2 id="novaTitulo"></h2>
    <button class="btn pequeno" data-fechar="dlgNova" data-i18n-title="cancelar">✕</button>
  </div>
  <div class="dlg-corpo">
    <div class="passos" id="passosNova">
      <span data-passo="1" class="ativo" data-i18n="passo1"></span>
      <span data-passo="2" data-i18n="passo2"></span>
      <span data-passo="3" data-i18n="passo3"></span>
    </div>

    <!-- Step 1 -->
    <div id="passo1">
      <p id="cadernoIntro" class="intro-caderno" hidden></p>
      <div class="campo">
        <label for="descricao" data-i18n="descricao"></label>
        <div class="entrada"><input id="descricao" maxlength="20" autocomplete="off" spellcheck="false"></div>
        <div class="contador"><span id="contDescricao">0</span>/20</div>
      </div>
      <div class="campo caixa">
        <label><input type="checkbox" id="cifrarDescricao"><span data-i18n="cifrarDescricao"></span></label>
        <div class="dica" data-i18n="cifrarDescricaoDica"></div>
      </div>

      <div class="duas-colunas">
        <div>
          <div class="campo">
            <label for="acesso" data-i18n="chaveAcesso"></label>
            <div class="entrada"><input id="acesso" type="password" autocomplete="new-password" spellcheck="false"><button type="button" class="olho" data-olho="acesso">👁</button></div>
            <div class="forca"><i id="forcaAcesso"></i></div>
            <div class="forca-rotulo" id="rotuloForcaAcesso">&nbsp;</div>
            <ul class="regras" id="regrasAcesso">
              <li data-regra="tam" data-i18n="regraTamAcesso"></li>
            </ul>
          </div>
          <div class="campo">
            <label for="acesso2" data-i18n="repitaAcesso"></label>
            <div class="entrada"><input id="acesso2" type="password" autocomplete="new-password" spellcheck="false"><button type="button" class="olho" data-olho="acesso2">👁</button></div>
            <ul class="regras"><li id="regraAcessoIgual" data-i18n="regraIgual"></li></ul>
          </div>
        </div>
        <div>
          <div class="campo">
            <label for="cripto" data-i18n="chaveCripto"></label>
            <div class="entrada"><input id="cripto" type="password" autocomplete="new-password" spellcheck="false"><button type="button" class="olho" data-olho="cripto">👁</button></div>
            <div class="forca"><i id="forcaCripto"></i></div>
            <div class="forca-rotulo" id="rotuloForcaCripto">&nbsp;</div>
            <ul class="regras" id="regrasCripto">
              <li data-regra="tam" data-i18n="regraTamCripto"></li>
              <li data-regra="mix" data-i18n="regraMix"></li>
              <li data-regra="dif" data-i18n="regraDif"></li>
            </ul>
          </div>
          <div class="campo">
            <label for="cripto2" data-i18n="repitaCripto"></label>
            <div class="entrada"><input id="cripto2" type="password" autocomplete="new-password" spellcheck="false"><button type="button" class="olho" data-olho="cripto2">👁</button></div>
            <ul class="regras"><li id="regraCriptoIgual" data-i18n="regraIgual"></li></ul>
          </div>
        </div>
      </div>
      <div class="combinado" id="combinado"></div>
      <div class="aviso" id="avisoChavesNova"></div>
    </div>

    <!-- Step 2 -->
    <div id="passo2" hidden>
      <div class="campo">
        <label data-i18n="qtdPalavras"></label>
        <div class="seletor-qtd" id="seletorQtd">
          <label><input type="radio" name="qtd" value="12"><span>12</span></label>
          <label><input type="radio" name="qtd" value="18"><span>18</span></label>
          <label><input type="radio" name="qtd" value="24" checked><span>24</span></label>
        </div>
        <div class="dica" data-i18n="dicaPalavras"></div>
      </div>
      <div class="grade-palavras" id="gradeEntrada"></div>
      <div class="status-palavras">
        <span id="contValidas"></span>
        <span id="msgChecksum"></span>
      </div>
      <datalist id="listaBip39"></datalist>
    </div>

const BIP39_INDICE = new Map(BIP39.map((p, i) => [p, i]));

const utf8 = (s) => new TextEncoder().encode(s);
const b64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const deB64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aleatorio = (n) => crypto.getRandomValues(new Uint8Array(n));
const normalizar = (s) => String(s).normalize('NFKC');

async function derivarBits(segredo, salt, iteracoes, bits) {
  const base = await crypto.subtle.importKey('raw', utf8(normalizar(segredo)), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iteracoes }, base, bits));
}

// Access-key verifier: lets the UI say "wrong access key" without revealing anything about the key.
async function calcularVerificador(acesso, salt, iteracoes) {
  return derivarBits('acesso\u0000' + acesso, salt, iteracoes, 256);
}

// AES-256 key derived from BOTH keys together.
async function derivarChaveAes(acesso, cripto, salt, iteracoes) {
  const bits = await derivarBits('aes\u0000' + acesso + '\u0000' + cripto, salt, iteracoes, 256);
  return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}

function igualConstante(a, b) {
  if (a.length !== b.length) return false;
  let dif = 0;
  for (let i = 0; i < a.length; i++) dif |= a[i] ^ b[i];
  return dif === 0;
}

// ---- Generic container (SPEC.md §2-§3). A wallet and an access book differ only in
// `formato`, in the plaintext and in the AAD suffix of `dados`. ----
async function cifrarArquivo({ formato, descricao, cifrarDescricao = false, texto, aadSufixo = '', acesso, cripto }, iteracoes = ITERACOES) {
  const id = crypto.randomUUID();
  const saltVerificador = aleatorio(16);
  const saltChave = aleatorio(16);
  const iv = aleatorio(12);
  const verificador = await calcularVerificador(acesso, saltVerificador, iteracoes);
  const chave = await derivarChaveAes(acesso, cripto, saltChave, iteracoes);
  const dados = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv, additionalData: utf8(id + aadSufixo) }, chave, utf8(texto));
  const arquivo = {
    formato,
    versao: VERSAO,
    id,
    descricao: cifrarDescricao ? '' : descricao,
    criadoEm: new Date().toISOString(),
    kdf: { algoritmo: 'PBKDF2-SHA256', iteracoes },
    saltVerificador: b64(saltVerificador),
    verificador: b64(verificador),
    saltChave: b64(saltChave),
    iv: b64(iv),
    dados: b64(dados),
  };
  if (cifrarDescricao) {
    const ivDesc = aleatorio(12);
    const dadosDesc = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: ivDesc, additionalData: utf8(id + '\u0000descricao') }, chave, utf8(descricao));
    arquivo.descricaoCifrada = { iv: b64(ivDesc), dados: b64(dadosDesc) };
  }
  return { arquivo, chave };
}

class ErroCofre extends Error {
  constructor(codigo) { super(codigo); this.codigo = codigo; }   // codigo: FORMATO | ACESSO | CRIPTO
}

// Returns { texto, descricao, chave }. `chave` is the non-extractable AES key, needed only to re-encrypt a book.
async function decifrarArquivo(obj, acesso, cripto, formatos, aadSufixo = '') {
  if (!obj || !formatos.includes(obj.formato) || !obj.kdf || !obj.dados) throw new ErroCofre('FORMATO');
  const it = obj.kdf.iteracoes;
  const verificador = await calcularVerificador(acesso, deB64(obj.saltVerificador), it);
  if (!igualConstante(verificador, deB64(obj.verificador))) throw new ErroCofre('ACESSO');
  const chave = await derivarChaveAes(acesso, cripto, deB64(obj.saltChave), it);
  let texto, descricao = obj.descricao || '';
  try {
    texto = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: deB64(obj.iv), additionalData: utf8(obj.id + aadSufixo) }, chave, deB64(obj.dados));
    if (obj.descricaoCifrada) {
      const d = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: deB64(obj.descricaoCifrada.iv), additionalData: utf8(obj.id + '\u0000descricao') },
        chave, deB64(obj.descricaoCifrada.dados));
      descricao = new TextDecoder().decode(d);
    }
  } catch {
    throw new ErroCofre('CRIPTO');
  }
  return { texto: new TextDecoder().decode(texto), descricao, chave };
}

// ---- Wallet (twinlock/1) ----
async function cifrarCarteira({ descricao, cifrarDescricao = false, palavras, acesso, cripto }, iteracoes = ITERACOES) {
  const { arquivo } = await cifrarArquivo({ formato: FORMATO, descricao, cifrarDescricao, texto: palavras.join(' '), acesso, cripto }, iteracoes);
  return arquivo;
}
// Returns { palavras: string[], descricao: string }
async function decifrarCarteira(obj, acesso, cripto) {
  const { texto, descricao } = await decifrarArquivo(obj, acesso, cripto, FORMATOS_ACEITOS);
  return { palavras: texto.split(' '), descricao };
}

// ---- Access book (twinlock-acessos/1, SPEC.md §8) ----
function ehCaderno(obj) { return !!obj && obj.formato === FORMATO_ACESSOS; }

// Keeps only known entry fields with the right types; unknown fields are preserved.
function normalizarAcesso(a) {
  const texto = (v) => (v == null ? '' : String(v));
  const campos = Array.isArray(a.campos)
    ? a.campos.map(c => ({ nome: texto(c && c.nome), valor: texto(c && c.valor), oculto: !!(c && c.oculto) })).filter(c => c.nome || c.valor)
    : [];
  return {
    ...a,
    id: texto(a.id) || crypto.randomUUID(),
    servico: texto(a.servico).trim(),
    endereco: texto(a.endereco).trim(),
    usuario: texto(a.usuario).trim(),
    codigoSenha: texto(a.codigoSenha).trim(),
    senha: texto(a.senha),
    notas: texto(a.notas),
    campos,
  };
}
function serializarAcessos(acessos) { return JSON.stringify({ acessos: acessos.map(normalizarAcesso) }); }
function desserializarAcessos(texto) {
  let doc;
  try { doc = JSON.parse(texto); } catch { throw new ErroCofre('FORMATO'); }
  if (!doc || !Array.isArray(doc.acessos)) throw new ErroCofre('FORMATO');
  return doc.acessos.filter(a => a && typeof a === 'object').map(normalizarAcesso);
}

// Returns { arquivo, chave }
async function cifrarCaderno({ descricao, cifrarDescricao = false, acessos = [], acesso, cripto }, iteracoes = ITERACOES) {
  const r = await cifrarArquivo({ formato: FORMATO_ACESSOS, descricao, cifrarDescricao, texto: serializarAcessos(acessos), aadSufixo: AAD_ACESSOS, acesso, cripto }, iteracoes);
  r.arquivo.atualizadoEm = r.arquivo.criadoEm;
  return r;
}
// Returns { acessos, descricao, chave }
async function decifrarCaderno(obj, acesso, cripto) {
  const { texto, descricao, chave } = await decifrarArquivo(obj, acesso, cripto, [FORMATO_ACESSOS], AAD_ACESSOS);
  return { acessos: desserializarAcessos(texto), descricao, chave };
}
// Re-encrypts a book with the key kept in memory: fresh IV, same id/salts/verifier/label (SPEC.md §8.4).
async function recifrarCaderno(obj, chave, acessos) {
  const iv = aleatorio(12);
  const dados = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv, additionalData: utf8(obj.id + AAD_ACESSOS) }, chave, utf8(serializarAcessos(acessos)));
  return { ...obj, versao: VERSAO, atualizadoEm: new Date().toISOString(), iv: b64(iv), dados: b64(dados) };
}

// ---- BIP39 ----
function limparPalavra(p) { return String(p || '').trim().toLowerCase(); }
function palavraValida(p) { return BIP39_INDICE.has(limparPalavra(p)); }

// Returns { ok: true } or { ok: false, codigo: 'QTD' | 'PALAVRA' | 'CHECKSUM', n?, posicoes? }
async function validarFrase(palavras) {
  const lista = palavras.map(limparPalavra);
  const n = lista.length;
  if (!QUANTIDADES.includes(n)) return { ok: false, codigo: 'QTD', n };
  const posicoes = lista.map((p, i) => palavraValida(p) ? -1 : i + 1).filter(i => i > 0);
  if (posicoes.length) return { ok: false, codigo: 'PALAVRA', posicoes };
  let bits = '';
  for (const p of lista) bits += BIP39_INDICE.get(p).toString(2).padStart(11, '0');
  const tamChecksum = n / 3;                    // 12→4, 18→6, 24→8 bits
  const tamEntropia = bits.length - tamChecksum;
  const entropia = new Uint8Array(tamEntropia / 8);
  for (let i = 0; i < entropia.length; i++) entropia[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', entropia));
  const checksumCalc = hash[0].toString(2).padStart(8, '0').slice(0, tamChecksum);
  if (checksumCalc !== bits.slice(tamEntropia)) return { ok: false, codigo: 'CHECKSUM' };
  return { ok: true };
}

// ---- Password strength (0..4) ----
function forcaSenha(s) {
  if (!s) return 0;
  let pontos = 0;
  if (s.length >= 10) pontos++;
  if (s.length >= 14) pontos++;
  if (s.length >= 18) pontos++;
  const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r => r.test(s)).length;
  if (classes >= 3) pontos++;
  if (classes <= 1 && pontos > 1) pontos--;
  return Math.min(4, pontos);
}

function detectarIdioma() {
  let salvo = null;
  try { salvo = localStorage.getItem('twinlock.idioma'); } catch { /* no storage */ }
  if (salvo && IDIOMAS[salvo]) return salvo;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('pt')) return 'pt-BR';
  if (nav.startsWith('es')) return 'es';
  return 'en';
}
let idioma = detectarIdioma();
function t(chave, params) {
  let s = (IDIOMAS[idioma] && IDIOMAS[idioma][chave]) ?? IDIOMAS.en[chave] ?? chave;
  if (params) for (const k of Object.keys(params)) s = s.split('{' + k + '}').join(params[k]);
  return s;
}
function aplicarIdioma() {

let toastTimer;
function toast(msg, erro = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'visivel' + (erro ? ' erro' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, erro ? 5000 : 3200);
}
function formatarData(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '?' : d.toLocaleDateString(idioma) + ' ' + d.toLocaleTimeString(idioma, { hour: '2-digit', minute: '2-digit' });
}
function mensagemValidacao(r) {
  if (r.codigo === 'QTD') return t('erroQtd', { n: r.n });
  if (r.codigo === 'PALAVRA') return t('erroPalavra', { pos: r.posicoes.join(', ') });
  return t('erroChecksum');
}
function mensagemErroCofre(e) {
  if (e && e.codigo === 'ACESSO') return t('erroAcesso');
  if (e && e.codigo === 'CRIPTO') return t('erroCripto');
  if (e && e.codigo === 'FORMATO') return t('erroFormato');
  return (e && e.message) || String(e);
}
function rotuloCarteira(c) {
  if (c.obj.descricaoCifrada && !c.obj.descricao) return { texto: t(ehCaderno(c.obj) ? 'cadernoCifrado' : 'carteiraCifrada'), cifrada: true };
  return { texto: c.obj.descricao || t('semDescricao'), cifrada: false };
}
function arquivoAceito(obj) { return !!obj && (FORMATOS_ACEITOS.includes(obj.formato) || ehCaderno(obj)); }
// Books first (used daily), then wallets; each group by creation date.
function ordenarArquivos(lista) {
  lista.sort((a, b) => (ehCaderno(b.obj) - ehCaderno(a.obj)) || String(a.obj.criadoEm).localeCompare(String(b.obj.criadoEm)));
  return lista;
}

// ---------- IndexedDB: remembers the chosen folder (a handle, never data) ----------
function abrirBanco() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('twinlock', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('config');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function guardarPasta(handle) {
  try {
    const db = await abrirBanco();
    const tx = db.transaction('config', 'readwrite');
    tx.objectStore('config').put(handle, 'pasta');
    await new Promise((res) => { tx.oncomplete = res; tx.onerror = res; });
  } catch { /* optional */ }
}
async function lerPastaGuardada() {
  try {
    const db = await abrirBanco();
    return await new Promise((res) => {
      const r = db.transaction('config').objectStore('config').get('pasta');
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch { return null; }
}

const temApiPasta = typeof window.showDirectoryPicker === 'function';

function atualizarChipPasta() {

  else if (estado.modo === 'manual') { chip.textContent = t('modoManual'); chip.title = ''; chip.classList.remove('ok'); }
  else { chip.textContent = t('semPasta'); chip.title = ''; chip.classList.remove('ok'); }
  $('btnAbrirPasta').textContent = estado.modo === 'pasta' ? t('trocarPasta') : t('abrirPasta');
}
async function escolherPasta() {
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'twinlock' });
    await usarPasta(handle);
    await guardarPasta(handle);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    toast(t('pastaErro', { erro: e.message || e }), true);
  }
}
async function usarPasta(handle) {
  estado.pasta = handle;
  estado.modo = 'pasta';
  atualizarChipPasta();
  $('btnRecarregar').hidden = false;
  await carregarCarteiras();
}
async function tentarReabrirPasta() {
  const handle = await lerPastaGuardada();
  if (!handle) return;
  const perm = await handle.queryPermission({ mode: 'readwrite' });
  if (perm === 'granted') { await usarPasta(handle); return; }
  const btn = $('btnReabrirPasta');
  btn.textContent = t('reabrirPasta', { nome: handle.name });
  btn.hidden = false;
  btn.onclick = async () => {
    const p = await handle.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') await usarPasta(handle);
    else toast(t('permissaoNegada'), true);
  };
}
async function carregarCarteiras() {
  if (estado.modo !== 'pasta') return;
  const lista = [];
  for await (const [nome, h] of estado.pasta.entries()) {
    if (h.kind !== 'file' || !nome.toLowerCase().endsWith('.json')) continue;
    try {
      const obj = JSON.parse(await (await h.getFile()).text());
      if (arquivoAceito(obj)) lista.push({ nome, obj });
    } catch { /* some other file */ }
  }
  estado.carteiras = ordenarArquivos(lista);
  renderizarCards();
}
// Wallets are c01.json, c02.json…; access books are a01.json, a02.json…
function proximoNomeArquivo(prefixo) {
  const usados = new Set(estado.carteiras.map(c => c.nome.toLowerCase()));
  for (let i = 1; i < 1000; i++) {
    const nome = prefixo + String(i).padStart(2, '0') + '.json';
    if (!usados.has(nome)) return nome;
  }
  return prefixo + Date.now() + '.json';
}
async function escreverArquivo(nome, conteudo) {
  const fh = await estado.pasta.getFileHandle(nome, { create: true });
  const w = await fh.createWritable();
  await w.write(conteudo);
  await w.close();
}
function baixarArquivo(nome, conteudo) {
  const blob = new Blob([conteudo], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
// Writes a brand-new file and returns its card item { nome, obj }.
async function gravarNovoArquivo(obj, prefixo) {
  const nome = proximoNomeArquivo(prefixo);
  const conteudo = JSON.stringify(obj, null, 2);
  if (estado.modo === 'pasta') await escreverArquivo(nome, conteudo);
  else baixarArquivo(nome, conteudo);
  const item = { nome, obj };
  estado.carteiras.push(item);
  ordenarArquivos(estado.carteiras);
  renderizarCards();
  return item;
}
const gravarCarteira = (obj) => gravarNovoArquivo(obj, 'c').then(i => i.nome);
// Overwrites an existing file (access books only). The previous content goes to <nome>.bak first (SPEC.md §8.4).
async function regravarArquivo(item, novoObj) {
  const conteudo = JSON.stringify(novoObj, null, 2);
  if (estado.modo === 'pasta') {
    try { await escreverArquivo(item.nome + '.bak', JSON.stringify(item.obj, null, 2)); } catch { /* the main write below decides */ }
    await escreverArquivo(item.nome, conteudo);
  } else {
    baixarArquivo(item.nome, conteudo);
  }
  item.obj = novoObj;
  renderizarCards();
}
async function excluirCarteira(carteira) {
  if (estado.modo === 'pasta') {
    await estado.pasta.removeEntry(carteira.nome);
    if (ehCaderno(carteira.obj)) { try { await estado.pasta.removeEntry(carteira.nome + '.bak'); } catch { /* no backup */ } }
  }
  estado.carteiras = estado.carteiras.filter(c => c !== carteira);
  renderizarCards();
}

  const okC3 = marcar($('regrasCripto').querySelector('[data-regra="dif"]'), c.length > 0 && c !== a);

// ---- Step 2: word grid ----
function montarGradeEntrada(qtd) {
  const grade = $('gradeEntrada');
  grade.innerHTML = '';
  for (let i = 1; i <= qtd; i++) {
    const div = document.createElement('div');
    div.className = 'palavra';
    div.innerHTML = `<b>${i}</b><input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" list="listaBip39" inputmode="latin" data-pos="${i}">`;
    const inp = div.querySelector('input');
    inp.addEventListener('input', () => {
      // Several words in one field (voice dictation, system autocomplete): spread them over the next positions.
      if (/\s/.test(inp.value)) { distribuirPalavras(inp, inp.value); return; }
      validarCampoPalavra(inp); atualizarPasso2();
    });
    inp.addEventListener('blur', () => { inp.value = limparPalavra(inp.value); validarCampoPalavra(inp); atualizarPasso2(); });
    inp.addEventListener('paste', (e) => { e.preventDefault(); toast(t('colarBloqueado'), true); });
    inp.addEventListener('keydown', (e) => {
      const pos = Number(inp.dataset.pos);
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        inp.value = limparPalavra(inp.value);
        validarCampoPalavra(inp); atualizarPasso2();
        focarPalavra(pos + 1);
      } else if (e.key === 'Backspace' && inp.value === '') {
        e.preventDefault();
        focarPalavra(pos - 1);
      }
    });
    grade.appendChild(div);
  }
}
function distribuirPalavras(inp, texto) {
  const partes = texto.trim().split(/\s+/).filter(Boolean);
  const inputs = [...$('gradeEntrada').querySelectorAll('input')];
  let pos = Number(inp.dataset.pos);
  if (!partes.length) inp.value = '';
  for (const p of partes) {
    const alvo = inputs[pos - 1];
    if (!alvo) break;
    alvo.value = limparPalavra(p);
    validarCampoPalavra(alvo);
    pos++;
  }
  atualizarPasso2();
  focarPalavra(Math.min(pos, inputs.length));
}
function focarPalavra(pos) {
  const alvo = $('gradeEntrada').querySelector(`input[data-pos="${pos}"]`);
  if (alvo) { alvo.focus(); alvo.select(); }
}
function validarCampoPalavra(inp) {
  const v = limparPalavra(inp.value);
  const div = inp.parentElement;
  div.classList.remove('ok', 'erro');
  if (!v) return;
  if (palavraValida(v)) div.classList.add('ok');
  else if (!BIP39.some(p => p.startsWith(v))) div.classList.add('erro');   // not even a prefix of a valid word
}

}

  const validas = lista.filter(palavraValida).length;
  $('contValidas').textContent = t('validas', { v: validas, n: lista.length });
  const msg = $('msgChecksum');
  if (estado.passo === 2) $('btnContinuar').disabled = true;
  if (validas < lista.length) { msg.textContent = ''; msg.style.color = ''; return; }
  const meu = ++validacaoPendente;
  const r = await validarFrase(lista);
  if (meu !== validacaoPendente) return;
  msg.textContent = r.ok ? t('checksumOk') : '✖ ' + mensagemValidacao(r);
  msg.style.color = r.ok ? 'var(--ok)' : 'var(--perigo)';
  if (estado.passo === 2) $('btnContinuar').disabled = !r.ok;
}

  if (!campos.servico) { erro.textContent = t('servicoObrigatorio'); erro.hidden = false; $('acServico').focus(); return; }
  const btn = $('btnSalvarAcesso');
  btn.disabled = true;
  try {
    const agora = new Date().toISOString();
    let lista, id;
    if (estado.acessoEditando) {
      id = estado.acessoEditando;
      lista = estado.acessos.map(x => x.id === id ? { ...x, ...campos, atualizadoEm: agora } : x);   // unknown fields survive
    } else {
      id = crypto.randomUUID();
      lista = [...estado.acessos, { id, ...campos, criadoEm: agora, atualizadoEm: agora }];
    }
    await salvarCaderno(lista);
    estado.acessoEditando = null;
    estado.acessoExpandido = id;
    limparFormAcesso();
    mostrarPainelCaderno('lista');
    renderizarAcessos();
    toast(t(estado.modo === 'pasta' ? 'acessoSalvo' : 'acessoSalvoDownload', { nome: estado.aberta.nome }));
  } catch (e) {
    erro.textContent = t('erroSalvarCaderno', { erro: e.message || e });
    erro.hidden = false;
  } finally {
    btn.disabled = false;
  }
}
async function excluirAcesso(a) {
  if (!confirm(t('excluirAcessoConfirma', { s: a.servico }))) return;
  try {
    await salvarCaderno(estado.acessos.filter(x => x.id !== a.id));
    renderizarAcessos();
    toast(t('acessoExcluido'));
  } catch (e) {
    toast(t('erroSalvarCaderno', { erro: e.message || e }), true);
  }
}
function cancelarFormAcesso() {
  limparFormAcesso();
  estado.acessoEditando = null;
  mostrarPainelCaderno('lista');
  renderizarAcessos();
}
$('btnNovoAcesso').addEventListener('click', () => abrirFormAcesso(null));
$('btnCancelarAcesso').addEventListener('click', cancelarFormAcesso);
$('btnSalvarAcesso').addEventListener('click', salvarAcesso);
$('btnAddCampo').addEventListener('click', () => adicionarLinhaCampo().focus());
$('abrirFormAcesso').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); salvarAcesso(); }
});

// =====================================================================
//  Start-up
// =====================================================================
async function autoteste() {
  const el = $('autoteste');
  el.textContent = t('autotestePendente');
  try {
    if (BIP39.length !== 2048 || BIP39[0] !== 'abandon' || BIP39[2047] !== 'zoo') throw new Error('BIP39 list incomplete');
    const frase = 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about'.split(' ');
    const v = await validarFrase(frase);
    if (!v.ok) throw new Error('BIP39 checksum');
    const obj = await cifrarCarteira({ descricao: 't', cifrarDescricao: true, palavras: frase, acesso: 'a1b2c3d4', cripto: 'x9y8z7w6v5u4' }, 1000);
    const volta = await decifrarCarteira(obj, 'a1b2c3d4', 'x9y8z7w6v5u4');
    if (volta.palavras.join(' ') !== frase.join(' ') || volta.descricao !== 't') throw new Error('round trip');
    let pegou = false;
    try { await decifrarCarteira(obj, 'errada123', 'x9y8z7w6v5u4'); } catch (e) { pegou = e.codigo === 'ACESSO'; }
    if (!pegou) throw new Error('verifier');
    const livro = await cifrarCaderno({ descricao: 'b', acessos: [{ servico: 'S', codigoSenha: '4' }], acesso: 'a1b2c3d4', cripto: 'x9y8z7w6v5u4' }, 1000);
    const re = await recifrarCaderno(livro.arquivo, livro.chave, [{ servico: 'S', codigoSenha: '5' }]);
    const lv = await decifrarCaderno(re, 'a1b2c3d4', 'x9y8z7w6v5u4');
    if (lv.acessos.length !== 1 || lv.acessos[0].codigoSenha !== '5') throw new Error('book round trip');
    el.textContent = t('autotesteOk');
  } catch (e) {
    el.textContent = t('autotesteFalhou', { erro: e.message });
    el.style.color = 'var(--perigo)';
    toast(t('autotesteFalhou', { erro: e.message }), true);
  }
}

(async function iniciar() {
  aplicarIdioma();
  $('selIdioma').addEventListener('change', (e) => {
    idioma = e.target.value;
    try { localStorage.setItem('twinlock.idioma', idioma); } catch { /* optional */ }
    aplicarIdioma();
  });
  if (!window.crypto || !crypto.subtle) {
    $('painelIncompativel').hidden = false;
    $('painelInicio').hidden = true;
    return;
  }
  // datalist with the 2048 words
  const dl = $('listaBip39');
  const frag = document.createDocumentFragment();
  for (const p of BIP39) { const o = document.createElement('option'); o.value = p; frag.appendChild(o); }
  dl.appendChild(frag);

  $('btnEscolherPasta').addEventListener('click', escolherPasta);
  $('btnAbrirPasta').addEventListener('click', escolherPasta);
  $('btnRecarregar').addEventListener('click', async () => { await carregarCarteiras(); toast(t('pastaRelida')); });
  $('btnModoManual').addEventListener('click', ativarModoManual);
  $('inputArquivos').addEventListener('change', (e) => carregarArquivosManuais(e.target.files));

  if (!temApiPasta) {
    $('btnEscolherPasta').hidden = true;
    $('btnAbrirPasta').hidden = true;
    $('btnModoManual').hidden = true;
    ativarModoManual();
    toast(t('semApiPasta'));
  } else {
    await tentarReabrirPasta();
  }
  autoteste();
})();
</script>
